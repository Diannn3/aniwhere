name: Verify AniWhere

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Astro type check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Routing secret scan
        run: pnpm routing:secrets


  browser:
    name: Playwright, accessibility, visual QA
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: pnpm test:e2e

      - name: Upload visual QA and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniwhere-premium-visual-qa
          path: tests/.artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
